name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag is releasable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false

    - name: Reject non-tag refs
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
          echo "::error::Release workflow can only run from a tag push (got ref_type=${GITHUB_REF_TYPE})." >&2
          exit 1
        fi

    - name: Checkout (full history for reachability check)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      with:
        fetch-depth: 0

    - name: Tag must point at the current tip of main or develop
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        git fetch origin main develop --quiet 2>/dev/null || true
        tag_commit="$(git rev-parse "${tag}^{commit}")"

        match=""
        for branch in origin/main origin/develop; do
          if ! git rev-parse --verify --quiet "$branch" >/dev/null 2>&1; then
            continue
          fi
          if [[ "$(git rev-parse "$branch")" == "$tag_commit" ]]; then
            match="$branch"
            break
          fi
        done

        if [[ -z "$match" ]]; then
          echo "::error::Tag $tag → $tag_commit is not the current tip of main or develop." >&2
          for branch in origin/main origin/develop; do
            if git rev-parse --verify --quiet "$branch" >/dev/null 2>&1; then
              echo "::error::  $branch tip: $(git rev-parse "$branch")" >&2
            fi
          done
          echo "::error::Tag only commits that are the current tip of a release branch." >&2
          echo "::error::If the release commit was amended after tagging, re-anchor: 'git tag -f $tag origin/develop && git push --force origin $tag'." >&2
          exit 1
        fi

        commit_msg="$(git log -1 --format=%s "$tag_commit")"
        if [[ "$commit_msg" != chore\(release\):* ]]; then
          echo "::error::Tag $tag points at commit $tag_commit whose message is '$commit_msg'." >&2
          echo "::error::Release tags must point at a 'chore(release): ...' commit produced by standard-version." >&2
          exit 1
        fi

        echo "Tag $tag points at the current tip of $match ($tag_commit)."

  pack:
    name: Build, test, pack
    needs: guard
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      with:
        fetch-depth: 0

    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Decode strong-name private key
      id: decode-key
      env:
        STRONG_NAME_KEY_BASE64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
      run: |
        set -euo pipefail
        if [[ -z "${STRONG_NAME_KEY_BASE64:-}" ]]; then
          echo "::error::STRONG_NAME_KEY_BASE64 secret is not set on the release-signing environment." >&2
          exit 1
        fi
        key_path="$RUNNER_TEMP/QuerySpec.private.snk"
        printf '%s' "$STRONG_NAME_KEY_BASE64" | base64 -d > "$key_path"
        chmod 600 "$key_path"
        actual_size=$(stat -c%s "$key_path")
        if [[ "$actual_size" -lt 500 ]]; then
          echo "::error::Decoded key is suspiciously small ($actual_size bytes). Re-encode with 'base64 -w 0'." >&2
          rm -f "$key_path"
          exit 1
        fi
        sentinel=$(head -c 16 "$key_path" | xxd -p | tr -d '\n')
        echo "::add-mask::$sentinel"
        echo "STRONG_NAME_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"

    - name: Extract version from tag
      id: version
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        version="${tag#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$tag' is not a valid SemVer version." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Releasing version $version from tag $tag"

    - name: Restore
      run: >
        dotnet restore QuerySpec.sln
        -p:Version=${{ steps.version.outputs.version }}

    - name: Build
      run: >
        dotnet build QuerySpec.sln
        --no-restore --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:ContinuousIntegrationBuild=true
        -p:TreatWarningsAsErrors=true
        -p:SignAssembly=true
        -p:DelaySign=false
        -p:AssemblyOriginatorKeyFile=${{ env.STRONG_NAME_PRIVATE_KEY }}

    - name: Verify assemblies are fully signed
      id: strong-name
      run: |
        set -euo pipefail
        chmod +x eng/verify-strong-name.sh
        eng/verify-strong-name.sh src/QuerySpec.Core/bin/Release \
                                  src/QuerySpec.EFCore/bin/Release \
                                  src/QuerySpec.DependencyInjection/bin/Release
        count=$(find src/QuerySpec.Core/bin/Release src/QuerySpec.EFCore/bin/Release src/QuerySpec.DependencyInjection/bin/Release \
                  -type f -name 'QuerySpec.*.dll' 2>/dev/null | wc -l | tr -d ' ')
        echo "assemblies=${count}" >> "$GITHUB_OUTPUT"
        # QuerySpec.Analyzers targets netstandard2.0 and is a DevelopmentDependency;
        # its assembly is not strong-name signed.

    - name: Test
      id: test
      run: >
        dotnet test QuerySpec.sln
        --no-build --configuration Release
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: release-test-results
        path: ./TestResults
        retention-days: 14

    - name: Verify ApiCompat suppression files are up to date
      run: |
        set -euo pipefail
        version="${{ steps.version.outputs.version }}"

        snap_dir="$(mktemp -d)"
        for project in QuerySpec.Core QuerySpec.EFCore QuerySpec.DependencyInjection; do
          src="src/${project}/CompatibilitySuppressions.xml"
          if [[ -f "$src" ]]; then
            cp "$src" "${snap_dir}/${project}.xml"
          else
            touch "${snap_dir}/${project}.xml"
          fi
        done

        dotnet pack QuerySpec.sln \
          --configuration Release \
          -p:Version="${version}" \
          -p:ApiCompatGenerateSuppressionFile=true \
          -p:ApiCompatGenerateSuppressionFileForChangedAssemblies=true \
          --output /tmp/apicompat-verify \
          --nologo \
          > /tmp/apicompat-pack.log 2>&1 || {
          echo "::error::dotnet pack failed during ApiCompat suppression verification."
          cat /tmp/apicompat-pack.log
          exit 1
        }

        fail=0
        for project in QuerySpec.Core QuerySpec.EFCore QuerySpec.DependencyInjection; do
          committed="${snap_dir}/${project}.xml"
          regenerated="src/${project}/CompatibilitySuppressions.xml"

          if [[ -f "$committed" && -f "$regenerated" ]]; then
            if ! diff -q "$committed" "$regenerated" > /dev/null 2>&1; then
              echo "::error::CompatibilitySuppressions.xml is stale for ${project}. Run 'npm run release' locally to regenerate, commit the updated file, then re-tag."
              echo "--- committed"
              echo "+++ regenerated"
              diff -u "$committed" "$regenerated" | head -60 || true
              fail=1
            fi
          elif [[ -f "$regenerated" && ! -s "$committed" ]]; then
            echo "::error::CompatibilitySuppressions.xml exists for ${project} after regeneration but was absent in the committed tree. Run 'npm run release' locally, commit the generated file, then re-tag."
            fail=1
          fi
          if [[ -s "$committed" ]]; then
            cp "$committed" "src/${project}/CompatibilitySuppressions.xml"
          fi
        done

        if [[ "$fail" == "1" ]]; then exit 1; fi
        echo "All CompatibilitySuppressions.xml files match the regenerated state."

    - name: Pack
      run: |
        set -euo pipefail
        mkdir -p ./artifacts
        for proj in \
          src/QuerySpec.Core/QuerySpec.Core.csproj \
          src/QuerySpec.EFCore/QuerySpec.EFCore.csproj \
          src/QuerySpec.DependencyInjection/QuerySpec.DependencyInjection.csproj \
          src/QuerySpec.Analyzers/QuerySpec.Analyzers.csproj
        do
          dotnet pack "$proj" \
            --no-build --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit=${{ github.sha }} \
            --output ./artifacts
        done

    - name: List produced packages
      run: ls -la ./artifacts

    - name: Verify package count and version-stamped filenames
      run: |
        set -euo pipefail
        count=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l)
        if [[ "$count" != "4" ]]; then
          echo "::error::Expected 4 nupkg files (Core, EFCore, DI, Analyzers), found $count." >&2
          ls -la ./artifacts
          exit 1
        fi
        snupkg_count=$(ls ./artifacts/*.snupkg 2>/dev/null | wc -l)
        if [[ "$snupkg_count" != "3" ]]; then
          echo "::error::Expected 3 snupkg symbol files (Analyzers has no symbols), found $snupkg_count." >&2
          exit 1
        fi
        for f in ./artifacts/*.nupkg; do
          name=$(basename "$f")
          if [[ "$name" != *"${{ steps.version.outputs.version }}.nupkg" ]]; then
            echo "::error::Package $name does not contain version ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi
        done
        echo "Package metadata OK: 4 nupkg + 3 snupkg at version ${{ steps.version.outputs.version }}."

    - name: Validate package contents and metadata
      id: pkg-validate
      run: |
        set -euo pipefail
        dotnet tool install --global Meziantou.Framework.NuGetPackageValidation.Tool --version 1.0.49
        export PATH="$PATH:$HOME/.dotnet/tools"
        failed=0
        validated=0
        for pkg in ./artifacts/*.nupkg; do
          validated=$((validated + 1))
          echo "::group::Validate $(basename "$pkg")"
          if ! meziantou.validate-nuget-package "$pkg"; then
            echo "::error::Package validation failed for $(basename "$pkg")"
            failed=$((failed + 1))
          fi
          echo "::endgroup::"
        done
        echo "validated=${validated}" >> "$GITHUB_OUTPUT"
        echo "failed=${failed}" >> "$GITHUB_OUTPUT"
        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi
        echo "All packages passed Meziantou NuGet content/metadata validation."

    - name: Verify SBOM in packages
      run: |
        set -euo pipefail
        failed=0
        for pkg in ./artifacts/*.nupkg; do
          echo "Verifying SBOM in $(basename "$pkg")"
          if ! unzip -l "$pkg" | grep -q '_manifest/spdx_2.2/manifest.spdx.json'; then
            echo "::error::SBOM manifest missing from $(basename "$pkg")"
            failed=$((failed + 1))
          fi
        done
        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi
        echo "SBOM verified for all $(ls ./artifacts/*.nupkg | wc -l | tr -d ' ') packages"

    - name: Test SourceLink mappings
      run: |
        set -euo pipefail
        dotnet tool install -g sourcelink
        export PATH="$PATH:$HOME/.dotnet/tools"
        failed=0
        work="$(mktemp -d)"
        for nupkg in ./artifacts/*.nupkg; do
          base="${nupkg%.nupkg}"
          snupkg="${base}.snupkg"
          pkg_name="$(basename "$nupkg")"
          echo "::group::SourceLink test $pkg_name"
          if [[ -f "$snupkg" ]]; then
            pkg_work="$work/$(basename "$base")"
            mkdir -p "$pkg_work"
            unzip -q -o "$snupkg" -d "$pkg_work"
            pdb_failed=0
            pdb_count=0
            while IFS= read -r -d '' pdb; do
              pdb_count=$((pdb_count + 1))
              if ! sourcelink test "$pdb"; then
                echo "::error::SourceLink test failed for $(basename "$pdb") (in $pkg_name)"
                pdb_failed=$((pdb_failed + 1))
              fi
            done < <(find "$pkg_work" -name '*.pdb' -print0)
            if [[ $pdb_count -eq 0 ]]; then
              echo "::error::No PDB files found inside $(basename "$snupkg")"
              failed=$((failed + 1))
            elif [[ $pdb_failed -ne 0 ]]; then
              failed=$((failed + 1))
            fi
          else
            if ! sourcelink test "$nupkg"; then
              echo "::error::SourceLink test failed for $pkg_name"
              failed=$((failed + 1))
            fi
          fi
          echo "::endgroup::"
        done
        rm -rf "$work"
        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi
        echo "All packages passed SourceLink mapping verification."

    - name: Upload packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: nuget-packages
        path: ./artifacts
        retention-days: 30

    - name: Emit release evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        version='${{ steps.version.outputs.version }}'

        sn_verdict=pass
        if [[ "${{ steps.strong-name.outcome }}" != "success" ]]; then sn_verdict=fail; fi
        sn_signed=$([[ "$sn_verdict" == "pass" ]] && echo true || echo false)
        sn_summary=$(jq -n \
          --argjson n '${{ steps.strong-name.outputs.assemblies }}' \
          --argjson s "$sn_signed" \
          '{assemblies_verified:$n, fully_signed:$s}')
        eng/emit-evidence.sh --gate strong-name-verify --verdict "$sn_verdict" \
          --summary-json "$sn_summary" --output-dir ./evidence

        nupkg_count=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')
        snupkg_count=$(ls ./artifacts/*.snupkg 2>/dev/null | wc -l | tr -d ' ')
        packages_json="[]"
        if [[ "$nupkg_count" -gt 0 ]]; then
          for pkg in ./artifacts/*.nupkg; do
            base=$(basename "$pkg" .nupkg)
            id=$(echo "$base" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$//')
            ver=$(echo "$base" | sed -E "s/^${id}\.//")
            size=$(stat -c%s "$pkg" 2>/dev/null || stat -f%z "$pkg")
            sum=$(sha256sum "$pkg" | cut -d' ' -f1)
            packages_json=$(jq --arg id "$id" --arg v "$ver" --argjson s "$size" --arg h "$sum" \
              '. + [{id:$id, version:$v, size_bytes:$s, sha256:$h}]' <<< "$packages_json")
          done
        fi
        pack_verdict=pass
        if [[ "$nupkg_count" -ne 4 || "$snupkg_count" -ne 3 ]]; then pack_verdict=fail; fi
        pack_summary=$(jq -n \
          --argjson nc "$nupkg_count" --argjson sc "$snupkg_count" \
          --arg ver "$version" --argjson pkgs "$packages_json" \
          '{package_count:$nc, snupkg_count:$sc, version:$ver, packages:$pkgs}')
        eng/emit-evidence.sh --gate pack --verdict "$pack_verdict" \
          --summary-json "$pack_summary" --details-artifact "nuget-packages" --output-dir ./evidence

        pv_verdict=pass
        if [[ "${{ steps.pkg-validate.outcome }}" != "success" ]]; then pv_verdict=fail; fi
        pv_summary=$(jq -n \
          --argjson v '${{ steps.pkg-validate.outputs.validated }}' \
          --argjson f '${{ steps.pkg-validate.outputs.failed }}' \
          '{packages_validated:$v, failed:$f, validator:"Meziantou.Framework.NuGetPackageValidation.Tool", validator_version:"1.0.49"}')
        eng/emit-evidence.sh --gate package-validation --verdict "$pv_verdict" \
          --summary-json "$pv_summary" --output-dir ./evidence

    - name: Upload release per-gate evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-release
        path: ./evidence
        retention-days: 90

    - name: Aggregate release evidence
      if: always()
      id: agg
      shell: bash
      run: |
        set +e
        chmod +x eng/aggregate-evidence.sh
        eng/aggregate-evidence.sh \
          --input-dir ./evidence \
          --output ./evidence-index.json \
          --workflow release
        echo "rc=$?" >> "$GITHUB_OUTPUT"

    - name: Upload release evidence-index
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-index
        path: ./evidence-index.json
        retention-days: 365

    - name: Halt before publish if release evidence is not green
      if: steps.agg.outputs.rc != '0'
      run: |
        echo "::error::Release evidence reports a blocking-gate failure. Halting before publish."
        exit 1

    - name: Scrub strong-name private key
      if: always()
      run: |
        set -euo pipefail
        if [[ -n "${STRONG_NAME_PRIVATE_KEY:-}" && -f "$STRONG_NAME_PRIVATE_KEY" ]]; then
          shred -uz "$STRONG_NAME_PRIVATE_KEY" 2>/dev/null || rm -f "$STRONG_NAME_PRIVATE_KEY"
        fi

  publish:
    name: Publish to NuGet
    needs: [guard, pack]
    runs-on: ubuntu-latest
    environment:
      name: nuget-release
      url: https://www.nuget.org/packages/QuerySpec.Core/${{ needs.pack.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false

    - name: Download packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Generate SLSA build provenance attestations
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
      with:
        subject-path: './artifacts/*.nupkg'

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
      with:
        dotnet-version: '10.0.x'

    - name: Login to NuGet.org via OIDC
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet.org
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "${NUGET_API_KEY:-}" ]]; then
          echo "::error::OIDC login did not return a NuGet API key. Verify the trusted-publisher entry on nuget.org." >&2
          exit 1
        fi
        for pkg in ./artifacts/*.nupkg; do
          echo "Publishing $pkg"
          dotnet nuget push "$pkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    - name: Mirror to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        for pkg in ./artifacts/*.nupkg; do
          echo "Mirroring $pkg"
          dotnet nuget push "$pkg" \
            --api-key "$GITHUB_TOKEN" \
            --source https://nuget.pkg.github.com/AbongileBoja/index.json \
            --skip-duplicate
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
