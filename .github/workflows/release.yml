name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag is releasable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Reject non-tag refs
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
          echo "::error::Release workflow can only run from a tag push (got ref_type=${GITHUB_REF_TYPE})." >&2
          exit 1
        fi

    - name: Checkout (full history for reachability check)
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Tag must be reachable from main or develop
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        git fetch origin main develop --quiet 2>/dev/null || true
        reachable=""
        for branch in origin/main origin/develop; do
          if git merge-base --is-ancestor "$tag" "$branch" 2>/dev/null; then
            reachable="$branch"
            break
          fi
        done
        if [[ -z "$reachable" ]]; then
          echo "::error::Tag $tag is not reachable from main or develop. Tag only commits already merged to a release branch." >&2
          exit 1
        fi
        echo "Tag $tag reachable from $reachable."

  pack:
    name: Build, test, pack
    needs: guard
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Decode strong-name private key
      id: decode-key
      env:
        STRONG_NAME_KEY_BASE64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
      run: |
        set -euo pipefail
        if [[ -z "${STRONG_NAME_KEY_BASE64:-}" ]]; then
          echo "::error::STRONG_NAME_KEY_BASE64 secret is not set on the release-signing environment." >&2
          exit 1
        fi
        key_path="$RUNNER_TEMP/QuerySpec.private.snk"
        printf '%s' "$STRONG_NAME_KEY_BASE64" | base64 -d > "$key_path"
        chmod 600 "$key_path"
        actual_size=$(stat -c%s "$key_path")
        if [[ "$actual_size" -lt 500 ]]; then
          echo "::error::Decoded key is suspiciously small ($actual_size bytes). Re-encode with 'base64 -w 0'." >&2
          rm -f "$key_path"
          exit 1
        fi
        sentinel=$(head -c 16 "$key_path" | xxd -p | tr -d '\n')
        echo "::add-mask::$sentinel"
        echo "STRONG_NAME_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"
        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"

    - name: Extract version from tag
      id: version
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        version="${tag#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$tag' is not a valid SemVer version." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Releasing version $version from tag $tag"

    - name: Restore
      run: >
        dotnet restore QuerySpec.sln
        -p:Version=${{ steps.version.outputs.version }}

    - name: Build
      run: >
        dotnet build QuerySpec.sln
        --no-restore --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:ContinuousIntegrationBuild=true
        -p:TreatWarningsAsErrors=true
        -p:SignAssembly=true
        -p:DelaySign=false
        -p:AssemblyOriginatorKeyFile=${{ env.STRONG_NAME_PRIVATE_KEY }}

    - name: Verify assemblies are fully signed
      run: |
        set -euo pipefail
        chmod +x eng/verify-strong-name.sh
        eng/verify-strong-name.sh src/QuerySpec.Core/bin/Release \
                                  src/QuerySpec.EFCore/bin/Release \
                                  src/QuerySpec.DependencyInjection/bin/Release

    - name: Test
      run: >
        dotnet test QuerySpec.sln
        --no-build --configuration Release
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: release-test-results
        path: ./TestResults
        retention-days: 14

    - name: Pack
      run: |
        set -euo pipefail
        mkdir -p ./artifacts
        for proj in \
          src/QuerySpec.Core/QuerySpec.Core.csproj \
          src/QuerySpec.EFCore/QuerySpec.EFCore.csproj \
          src/QuerySpec.DependencyInjection/QuerySpec.DependencyInjection.csproj
        do
          dotnet pack "$proj" \
            --no-build --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./artifacts
        done

    - name: List produced packages
      run: ls -la ./artifacts

    - name: Verify packages
      run: |
        set -euo pipefail
        count=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l)
        if [[ "$count" != "3" ]]; then
          echo "::error::Expected 3 nupkg files, found $count." >&2
          ls -la ./artifacts
          exit 1
        fi
        snupkg_count=$(ls ./artifacts/*.snupkg 2>/dev/null | wc -l)
        if [[ "$snupkg_count" != "3" ]]; then
          echo "::error::Expected 3 snupkg symbol files, found $snupkg_count." >&2
          exit 1
        fi
        for f in ./artifacts/*.nupkg; do
          name=$(basename "$f")
          if [[ "$name" != *"${{ steps.version.outputs.version }}.nupkg" ]]; then
            echo "::error::Package $name does not contain version ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi
        done
        echo "Package metadata OK: 3 nupkg + 3 snupkg at version ${{ steps.version.outputs.version }}."

    - name: Upload packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: nuget-packages
        path: ./artifacts
        retention-days: 30

    - name: Scrub strong-name private key
      if: always()
      run: |
        set -euo pipefail
        if [[ -n "${STRONG_NAME_PRIVATE_KEY:-}" && -f "$STRONG_NAME_PRIVATE_KEY" ]]; then
          shred -uz "$STRONG_NAME_PRIVATE_KEY" 2>/dev/null || rm -f "$STRONG_NAME_PRIVATE_KEY"
        fi

  publish:
    name: Publish to NuGet
    needs: [guard, pack]
    runs-on: ubuntu-latest
    environment:
      name: nuget-release
      url: https://www.nuget.org/packages/QuerySpec.Core/${{ needs.pack.outputs.version }}
    permissions:
      contents: write
      packages: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
      with:
        dotnet-version: '10.0.x'

    - name: Push to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "${NUGET_API_KEY:-}" ]]; then
          echo "::error::NUGET_API_KEY secret is not set." >&2
          exit 1
        fi
        for pkg in ./artifacts/*.nupkg; do
          echo "Publishing $pkg"
          dotnet nuget push "$pkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    - name: Mirror to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        for pkg in ./artifacts/*.nupkg; do
          echo "Mirroring $pkg"
          dotnet nuget push "$pkg" \
            --api-key "$GITHUB_TOKEN" \
            --source https://nuget.pkg.github.com/AbongileBoja/index.json \
            --skip-duplicate
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
