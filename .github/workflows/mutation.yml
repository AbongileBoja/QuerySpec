name: Mutation testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  schedule:
    - cron: '0 4 * * 1'

permissions: read-all

jobs:
  stryker-core:
    name: Stryker.NET — QuerySpec.Core (full library)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore tools
      run: dotnet tool restore

    - name: Restore packages
      env:
        QUERYSPEC_SKIP_SIGN: 'true'
      run: dotnet restore QuerySpec.sln

    - name: Run Stryker Core (PR incremental)
      if: github.event_name == 'pull_request'
      env:
        QUERYSPEC_SKIP_SIGN: 'true'
        STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          VERSION="${GITHUB_HEAD_REF}"
        else
          VERSION="${GITHUB_REF_NAME}"
        fi
        if [[ -z "${STRYKER_DASHBOARD_API_KEY}" ]]; then
          echo "::warning::STRYKER_DASHBOARD_API_KEY not set — running without dashboard reporter and baseline."
          REPORTERS_FLAG="--reporter html --reporter progress --reporter json"
          BASELINE_FLAG="--with-baseline false"
        else
          REPORTERS_FLAG=""
          BASELINE_FLAG=""
        fi
        dotnet stryker --config-file stryker-config.json --version "$VERSION" $REPORTERS_FLAG $BASELINE_FLAG

    - name: Run Stryker Core (full sweep)
      if: github.event_name != 'pull_request'
      env:
        QUERYSPEC_SKIP_SIGN: 'true'
        STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          VERSION="${GITHUB_HEAD_REF}"
        else
          VERSION="${GITHUB_REF_NAME}"
        fi
        if [[ -z "${STRYKER_DASHBOARD_API_KEY}" ]]; then
          echo "::warning::STRYKER_DASHBOARD_API_KEY not set — running without dashboard reporter and baseline."
          REPORTERS_FLAG="--reporter html --reporter progress --reporter json"
          BASELINE_FLAG="--with-baseline false"
        else
          REPORTERS_FLAG=""
          BASELINE_FLAG=""
        fi
        dotnet stryker --config-file stryker-config.json --version "$VERSION" $REPORTERS_FLAG $BASELINE_FLAG

    - name: Upload Core Stryker HTML report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: stryker-report-core
        path: StrykerOutput/
        retention-days: 90

    - name: Run Stryker Core Security (additional security-focused sweep)
      if: github.event_name != 'pull_request'
      env:
        QUERYSPEC_SKIP_SIGN: 'true'
        STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          VERSION="${GITHUB_HEAD_REF}"
        else
          VERSION="${GITHUB_REF_NAME}"
        fi
        if [[ -z "${STRYKER_DASHBOARD_API_KEY}" ]]; then
          echo "::warning::STRYKER_DASHBOARD_API_KEY not set — running without dashboard reporter and baseline."
          REPORTERS_FLAG="--reporter html --reporter progress --reporter json"
          BASELINE_FLAG="--with-baseline false"
        else
          REPORTERS_FLAG=""
          BASELINE_FLAG=""
        fi
        dotnet stryker --config-file stryker-config.security.json --version "$VERSION" $REPORTERS_FLAG $BASELINE_FLAG

    - name: Upload Core Security Stryker report
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: stryker-report-core-security
        path: StrykerOutput/
        retention-days: 90

  stryker-efcore:
    name: Stryker.NET — QuerySpec.EFCore
