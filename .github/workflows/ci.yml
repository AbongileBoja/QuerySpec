name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8, 9, 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore
      run: dotnet restore QuerySpec.sln

    - name: Build (Release, warnings as errors)
      run: dotnet build QuerySpec.sln --no-restore --configuration Release -p:TreatWarningsAsErrors=true

    - name: Test with coverage
      run: >
        dotnet test QuerySpec.sln
        --no-build --configuration Release
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults
        -- RunConfiguration.CollectSourceInformation=true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.dotnet-version }}
        path: ./TestResults
        retention-days: 7

    - name: Install ReportGenerator
      if: matrix.dotnet-version == '10.0.x'
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage summary
      if: matrix.dotnet-version == '10.0.x'
      run: >
        reportgenerator
        -reports:./TestResults/**/coverage.cobertura.xml
        -targetdir:./CoverageReport
        -reporttypes:"MarkdownSummary;Cobertura"

    - name: Enforce coverage threshold
      if: matrix.dotnet-version == '10.0.x'
      shell: bash
      env:
        MIN_LINE_COVERAGE: '70'
      run: |
        set -euo pipefail
        summary="./CoverageReport/Summary.md"
        if [[ ! -f "$summary" ]]; then
          echo "Coverage summary not found at $summary" >&2
          exit 1
        fi
        line_cov=$(grep -oP 'Line coverage:\s*\K[0-9.]+' "$summary" | head -1 || true)
        if [[ -z "${line_cov:-}" ]]; then
          echo "Could not parse line coverage from summary." >&2
          cat "$summary"
          exit 1
        fi
        echo "Line coverage: ${line_cov}%  (threshold: ${MIN_LINE_COVERAGE}%)"
        awk -v c="$line_cov" -v t="$MIN_LINE_COVERAGE" 'BEGIN { if (c+0 < t+0) exit 1 }'

    - name: Upload coverage report
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./CoverageReport
        retention-days: 14

    - name: Pack
      if: matrix.dotnet-version == '10.0.x'
      run: dotnet pack QuerySpec.sln --no-build --configuration Release --output ./artifacts

    - name: Upload NuGet artifacts
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts
        retention-days: 14

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore QuerySpec.sln
    - name: Verify formatting
      run: dotnet format QuerySpec.sln --verify-no-changes --severity warn

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: security-and-quality

    - name: Build for CodeQL
      run: dotnet build QuerySpec.sln --configuration Release -p:TreatWarningsAsErrors=false

    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
    - name: Review dependencies
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore QuerySpec.sln
    - name: List vulnerable packages
      run: |
        set -e
        output=$(dotnet list QuerySpec.sln package --vulnerable --include-transitive 2>&1 || true)
        echo "$output"
        if echo "$output" | grep -qi 'has the following vulnerable packages'; then
          echo "::error::Vulnerable NuGet packages detected"
          exit 1
        fi

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install commitlint
      run: npm ci --no-audit --no-fund

    - name: Lint PR commits
      if: github.event_name == 'pull_request'
      run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

    - name: Lint last commit (push)
      if: github.event_name == 'push'
      run: npx commitlint --from=HEAD~1 --to=HEAD --verbose
