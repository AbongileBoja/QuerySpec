name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions: read-all

jobs:
  build:
    name: Build & test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

    - name: Setup .NET 8, 9, 10
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore
      run: dotnet restore QuerySpec.sln

    - name: Build (Release, warnings as errors)
      id: build
      run: |
        set -euo pipefail
        log=$(mktemp)
        dotnet build QuerySpec.sln --no-restore --configuration Release \
          -p:TreatWarningsAsErrors=true 2>&1 | tee "$log"
        warnings=$(grep -cE ': warning ' "$log" || true)
        errors=$(grep -cE ': error ' "$log" || true)
        echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"
        echo "errors=${errors}" >> "$GITHUB_OUTPUT"

    - name: Test with coverage
      id: test
      # `dotnet test QuerySpec.sln` runs all test projects across all target frameworks
      # in parallel. `LogFileName=` would point all runners at the same trx file and
      # the resulting overwrite race makes one of the runners exit non-zero on roughly
      # one matrix slot per run (despite every test passing). `LogFilePrefix=` gives
      # each test run a unique trx filename and removes the race.
      run: |
        set -euo pipefail
        dotnet test QuerySpec.sln \
          --no-build --configuration Release \
          --logger "trx;LogFilePrefix=test-results" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          -- RunConfiguration.CollectSourceInformation=true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: test-results-${{ matrix.dotnet-version }}
        path: ./TestResults
        retention-days: 7

    - name: Install ReportGenerator
      if: matrix.dotnet-version == '10.0.x'
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage summary
      if: matrix.dotnet-version == '10.0.x'
      run: >
        reportgenerator
        -reports:./TestResults/**/coverage.cobertura.xml
        -targetdir:./CoverageReport
        -reporttypes:"MarkdownSummary;Cobertura"

    - name: Enforce coverage threshold
      id: coverage
      if: matrix.dotnet-version == '10.0.x'
      shell: bash
      env:
        MIN_LINE_COVERAGE: '91'
        MIN_BRANCH_COVERAGE: '81'
      run: |
        set -euo pipefail
        summary="./CoverageReport/Summary.md"
        if [[ ! -f "$summary" ]]; then
          echo "Coverage summary not found at $summary" >&2
          exit 1
        fi
        line_cov=$(grep -E 'Line coverage' "$summary" \
          | head -1 \
          | grep -oE '[0-9]+(\.[0-9]+)?' \
          | head -1 || true)
        branch_cov=$(grep -E 'Branch coverage' "$summary" \
          | head -1 \
          | grep -oE '[0-9]+(\.[0-9]+)?' \
          | head -1 || true)
        method_cov=$(grep -E 'Method coverage' "$summary" \
          | head -1 \
          | grep -oE '[0-9]+(\.[0-9]+)?' \
          | head -1 || true)
        if [[ -z "${line_cov:-}" ]]; then
          echo "Could not parse line coverage from summary." >&2
          cat "$summary"
          exit 1
        fi
        echo "Line coverage:   ${line_cov}%  (threshold: ${MIN_LINE_COVERAGE}%)"
        echo "Branch coverage: ${branch_cov:-n/a}%  (threshold: ${MIN_BRANCH_COVERAGE}%)"
        echo "Method coverage: ${method_cov:-n/a}%  (collected, not gated)"
        echo "line_pct=${line_cov}" >> "$GITHUB_OUTPUT"
        echo "branch_pct=${branch_cov:-0}" >> "$GITHUB_OUTPUT"
        echo "method_pct=${method_cov:-0}" >> "$GITHUB_OUTPUT"
        echo "line_threshold=${MIN_LINE_COVERAGE}" >> "$GITHUB_OUTPUT"
        echo "branch_threshold=${MIN_BRANCH_COVERAGE}" >> "$GITHUB_OUTPUT"
        awk -v lc="$line_cov" -v lt="$MIN_LINE_COVERAGE" \
            -v bc="${branch_cov:-0}" -v bt="$MIN_BRANCH_COVERAGE" \
            'BEGIN {
               fail=0
               if (lc+0 < lt+0) { print "FAIL: line coverage " lc "% < " lt "%" > "/dev/stderr"; fail=1 }
               if (bc+0 < bt+0) { print "FAIL: branch coverage " bc "% < " bt "%" > "/dev/stderr"; fail=1 }
               exit fail
             }'

    - name: Upload coverage report
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-report
        path: ./CoverageReport
        retention-days: 14

    - name: Generate coverage markdown for PR
      id: coverage-md
      if: matrix.dotnet-version == '10.0.x' && github.event_name == 'pull_request'
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95  # v1.3.0
      with:
        filename: ./CoverageReport/Cobertura.xml
        badge: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: file
        thresholds: '81 91'

    - name: Post coverage summary to PR
      if: matrix.dotnet-version == '10.0.x' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
      with:
        recreate: true
        path: code-coverage-results.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        header: coverage-summary

    - name: Pack
      if: matrix.dotnet-version == '10.0.x'
      run: dotnet pack QuerySpec.sln --no-build --configuration Release --output ./artifacts

    - name: Upload NuGet artifacts
      if: matrix.dotnet-version == '10.0.x'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: nuget-packages
        path: ./artifacts
        retention-days: 14

    - name: Compute test counts
      if: always()
      id: test-counts
      shell: bash
      run: |
        set -euo pipefail
        total=0; passed=0; failed=0; skipped=0
        for trx in $(find ./TestResults -name '*.trx' 2>/dev/null); do
          c_total=$(grep -oE 'total="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
          c_passed=$(grep -oE 'passed="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
          c_failed=$(grep -oE 'failed="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
          c_skipped=$(grep -oE 'notExecuted="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
          total=$((total + c_total))
          passed=$((passed + c_passed))
          failed=$((failed + c_failed))
          skipped=$((skipped + c_skipped))
        done
        echo "total=${total}"   >> "$GITHUB_OUTPUT"
        echo "passed=${passed}" >> "$GITHUB_OUTPUT"
        echo "failed=${failed}" >> "$GITHUB_OUTPUT"
        echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"

    - name: Emit build evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        if [[ "${{ steps.build.outcome }}" != "success" ]]; then verdict=fail; fi
        warnings='${{ steps.build.outputs.warnings }}'
        errors='${{ steps.build.outputs.errors }}'
        summary=$(jq -n \
          --arg tfm "${{ matrix.dotnet-version }}" \
          --argjson w "${warnings:-0}" --argjson e "${errors:-0}" \
          '{tfm:$tfm, configuration:"Release", warnings:$w, errors:$e, treat_warnings_as_errors:true}')
        eng/emit-evidence.sh \
          --gate build \
          --matrix-slot "${{ matrix.dotnet-version }}" \
          --verdict "$verdict" \
          --summary-json "$summary" \
          --details-artifact "test-results-${{ matrix.dotnet-version }}" \
          --output-dir ./evidence

    - name: Emit test evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        if [[ "${{ steps.test.outcome }}" != "success" ]]; then verdict=fail; fi
        line_pct='${{ steps.coverage.outputs.line_pct }}'
        branch_pct='${{ steps.coverage.outputs.branch_pct }}'
        method_pct='${{ steps.coverage.outputs.method_pct }}'
        line_threshold='${{ steps.coverage.outputs.line_threshold }}'
        branch_threshold='${{ steps.coverage.outputs.branch_threshold }}'
        coverage_block=""
        if [[ -n "$line_pct" ]]; then
          coverage_block=$(jq -n \
            --argjson l "${line_pct}" \
            --argjson b "${branch_pct:-0}" \
            --argjson m "${method_pct:-0}" \
            --argjson lt "${line_threshold:-91}" \
            --argjson bt "${branch_threshold:-81}" \
            --argjson meets $([[ $(awk -v lc="$line_pct" -v lt="${line_threshold:-91}" -v bc="${branch_pct:-0}" -v bt="${branch_threshold:-81}" 'BEGIN { print (lc+0 >= lt+0 && bc+0 >= bt+0) }') == "1" ]] && echo true || echo false) \
            '{coverage_line_pct:$l, coverage_branch_pct:$b, coverage_method_pct:$m, coverage_line_threshold_pct:$lt, coverage_branch_threshold_pct:$bt, coverage_meets_threshold:$meets}')
        else
          coverage_block='{}'
        fi
        summary=$(jq -n \
          --arg tfm "${{ matrix.dotnet-version }}" \
          --argjson total '${{ steps.test-counts.outputs.total }}' \
          --argjson passed '${{ steps.test-counts.outputs.passed }}' \
          --argjson failed '${{ steps.test-counts.outputs.failed }}' \
          --argjson skipped '${{ steps.test-counts.outputs.skipped }}' \
          --argjson cov "$coverage_block" \
          '{tfm:$tfm, total:$total, passed:$passed, failed:$failed, skipped:$skipped} + $cov')
        eng/emit-evidence.sh \
          --gate test \
          --matrix-slot "${{ matrix.dotnet-version }}" \
          --verdict "$verdict" \
          --summary-json "$summary" \
          --details-artifact "test-results-${{ matrix.dotnet-version }}" \
          --output-dir ./evidence

    - name: Emit pack evidence
      if: always() && matrix.dotnet-version == '10.0.x'
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        nupkg_count=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')
        snupkg_count=$(ls ./artifacts/*.snupkg 2>/dev/null | wc -l | tr -d ' ')
        verdict=pass
        if [[ "$nupkg_count" -eq 0 ]]; then verdict=fail; fi
        packages_json="[]"
        if [[ "$nupkg_count" -gt 0 ]]; then
          packages_json="[]"
          for pkg in ./artifacts/*.nupkg; do
            base=$(basename "$pkg" .nupkg)
            id=$(echo "$base" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$//')
            ver=$(echo "$base" | sed -E "s/^${id}\.//")
            size=$(stat -c%s "$pkg" 2>/dev/null || stat -f%z "$pkg")
            sum=$(sha256sum "$pkg" | cut -d' ' -f1)
            packages_json=$(jq --arg id "$id" --arg v "$ver" --argjson s "$size" --arg h "$sum" \
              '. + [{id:$id, version:$v, size_bytes:$s, sha256:$h}]' <<< "$packages_json")
          done
        fi
        version=$(jq -r 'first(.[]) | .version // "0.0.0"' <<< "$packages_json")
        summary=$(jq -n \
          --argjson nc "$nupkg_count" --argjson sc "$snupkg_count" \
          --arg ver "$version" --argjson pkgs "$packages_json" \
          '{package_count:$nc, snupkg_count:$sc, version:$ver, packages:$pkgs}')
        eng/emit-evidence.sh \
          --gate pack \
          --verdict "$verdict" \
          --summary-json "$summary" \
          --details-artifact "nuget-packages" \
          --output-dir ./evidence

    - name: Upload per-gate evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-build-test-${{ matrix.dotnet-version }}
        path: ./evidence
        retention-days: 30

  format:
    name: dotnet format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore QuerySpec.sln
    - name: Verify formatting
      id: format
      run: dotnet format QuerySpec.sln --verify-no-changes --severity warn

    - name: Emit format evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        files_with_diffs=0
        if [[ "${{ steps.format.outcome }}" != "success" ]]; then
          verdict=fail
          files_with_diffs=1
        fi
        summary=$(jq -n --argjson f "$files_with_diffs" '{files_with_diffs:$f, severity:"warn"}')
        eng/emit-evidence.sh --gate format --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence
    - name: Upload format evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-format
        path: ./evidence
        retention-days: 30

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
      with:
        languages: csharp
        queries: security-and-quality

    - name: Build for CodeQL
      run: dotnet build QuerySpec.sln --configuration Release -p:TreatWarningsAsErrors=false

    - name: Run CodeQL analysis
      id: codeql
      uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
      with:
        category: "/language:csharp"

    - name: Read CodeQL alert counts
      id: codeql_alerts
      if: always() && steps.codeql.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ github.ref }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        count_for() {
          local sev="$1"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/code-scanning/alerts?ref=${REF}&state=open&severity=${sev}&tool_name=CodeQL&per_page=100" \
            --paginate --jq 'length' \
            | awk '{s+=$1} END {print s+0}'
        }
        crit=$(count_for critical)
        high=$(count_for high)
        med=$(count_for medium)
        low=$(count_for low)
        echo "alerts_critical=${crit}" >> "$GITHUB_OUTPUT"
        echo "alerts_high=${high}"     >> "$GITHUB_OUTPUT"
        echo "alerts_medium=${med}"    >> "$GITHUB_OUTPUT"
        echo "alerts_low=${low}"       >> "$GITHUB_OUTPUT"
        echo "CodeQL open alerts: critical=${crit} high=${high} medium=${med} low=${low}"
        if [[ "${high}" -gt 0 ]]; then
          echo "::warning::CodeQL reports ${high} open high-severity alert(s). Currently warn-only; ratchet to fail tracked in #200."
        fi

    - name: Emit CodeQL evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        crit='${{ steps.codeql_alerts.outputs.alerts_critical }}'
        high='${{ steps.codeql_alerts.outputs.alerts_high }}'
        med='${{ steps.codeql_alerts.outputs.alerts_medium }}'
        low='${{ steps.codeql_alerts.outputs.alerts_low }}'
        crit=${crit:-0}; high=${high:-0}; med=${med:-0}; low=${low:-0}
        verdict=pass
        if [[ "${{ steps.codeql.outcome }}" != "success" ]]; then verdict=fail; fi
        if [[ "${{ steps.codeql_alerts.outcome }}" != "success" ]]; then verdict=fail; fi
        if [[ "${crit}" -gt 0 ]]; then verdict=fail; fi
        summary=$(jq -n \
          --argjson c "$crit" --argjson h "$high" --argjson m "$med" --argjson l "$low" \
          '{language:"csharp", queries:"security-and-quality",
            alerts_critical:$c, alerts_high:$h, alerts_medium:$m, alerts_low:$l}')
        eng/emit-evidence.sh --gate codeql --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence \
          --notes "Parsed from GitHub Code Scanning API for ref ${REF}, tool=CodeQL. critical>0 fails the gate; high>0 is warn-only (ratchet tracked in #200)."
    - name: Upload codeql evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-codeql
        path: ./evidence
        retention-days: 30

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - name: Review dependencies
      id: depreview
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
      with:
        fail-on-severity: high

    - name: Emit dependency-review evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        failed=false
        if [[ "${{ steps.depreview.outcome }}" != "success" ]]; then verdict=fail; failed=true; fi
        summary=$(jq -n --argjson f "$failed" '{added_dependencies:0, severity_threshold:"high", failed:$f}')
        eng/emit-evidence.sh --gate dependency-review --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence
    - name: Upload dependency-review evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-dependency-review
        path: ./evidence
        retention-days: 30

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore QuerySpec.sln
    - name: List vulnerable packages
      id: vuln
      run: |
        set -e
        output=$(dotnet list QuerySpec.sln package --vulnerable --include-transitive 2>&1 || true)
        echo "$output"
        echo "$output" > /tmp/vuln-output.txt
        if echo "$output" | grep -qi 'has the following vulnerable packages'; then
          echo "::error::Vulnerable NuGet packages detected"
          echo "vulnerable=1" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "vulnerable=0" >> "$GITHUB_OUTPUT"

    - name: List deprecated and outdated
      if: always()
      id: depr
      shell: bash
      run: |
        set +e
        dep_out=$(dotnet list QuerySpec.sln package --deprecated 2>&1 || true)
        out_out=$(dotnet list QuerySpec.sln package --outdated 2>&1 || true)
        dep_count=$(echo "$dep_out" | grep -cE '^\s+>' || true)
        out_count=$(echo "$out_out" | grep -cE '^\s+>' || true)
        echo "deprecated=${dep_count}" >> "$GITHUB_OUTPUT"
        echo "outdated=${out_count}" >> "$GITHUB_OUTPUT"

    - name: Emit vulnerability evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        vuln_count='${{ steps.vuln.outputs.vulnerable }}'
        if [[ "${{ steps.vuln.outcome }}" != "success" ]]; then verdict=fail; fi
        summary=$(jq -n \
          --argjson v "${vuln_count:-0}" \
          --argjson d "${{ steps.depr.outputs.deprecated }}" \
          --argjson o "${{ steps.depr.outputs.outdated }}" \
          '{vulnerable_count:$v, deprecated_count:$d, outdated_count:$o, vulnerable_packages:[]}')
        eng/emit-evidence.sh --gate vulnerability-scan --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence
    - name: Upload vulnerability evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-vulnerability-scan
        path: ./evidence
        retention-days: 30

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install commitlint
      run: npm ci --no-audit --no-fund

    - name: Lint PR commits
      id: lint-pr
      if: github.event_name == 'pull_request'
      run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

    - name: Lint last commit (push)
      id: lint-push
      if: github.event_name == 'push'
      run: npx commitlint --from=HEAD~1 --to=HEAD --verbose

    - name: Emit commitlint evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        if [[ "${{ steps.lint-pr.outcome }}" == "failure" || "${{ steps.lint-push.outcome }}" == "failure" ]]; then verdict=fail; fi
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          checked=$(git rev-list --count "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" 2>/dev/null || echo 0)
        else
          checked=1
        fi
        violations=0
        if [[ "$verdict" == "fail" ]]; then violations=1; fi
        summary=$(jq -n --argjson c "$checked" --argjson v "$violations" \
          '{commits_checked:$c, violations:$v}')
        eng/emit-evidence.sh --gate commitlint --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence
    - name: Upload commitlint evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-commitlint
        path: ./evidence
        retention-days: 30

  reproducibility:
    name: Reproducibility check (deterministic build)
    runs-on: ubuntu-latest
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Record start time
      run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: '10.0.x'

    - name: First build
      run: |
        set -euo pipefail
        common="-p:ContinuousIntegrationBuild=true -p:Deterministic=true -p:SignAssembly=false -p:DelaySign=false"
        for proj in \
          src/QuerySpec.Analyzers/QuerySpec.Analyzers.csproj \
          src/QuerySpec.Analyzers.CodeFixes/QuerySpec.Analyzers.CodeFixes.csproj \
          src/QuerySpec.Core/QuerySpec.Core.csproj \
          src/QuerySpec.EFCore/QuerySpec.EFCore.csproj \
          src/QuerySpec.DependencyInjection/QuerySpec.DependencyInjection.csproj
        do
          dotnet build "$proj" --configuration Release $common
        done
        mkdir -p /tmp/build1
        cp src/QuerySpec.Core/bin/Release/net10.0/QuerySpec.Core.dll                                            /tmp/build1/
        cp src/QuerySpec.EFCore/bin/Release/net10.0/QuerySpec.EFCore.dll                                        /tmp/build1/
        cp src/QuerySpec.DependencyInjection/bin/Release/net10.0/QuerySpec.DependencyInjection.dll              /tmp/build1/
        cp src/QuerySpec.Analyzers/bin/Release/netstandard2.0/QuerySpec.Analyzers.dll                           /tmp/build1/
        cp src/QuerySpec.Analyzers.CodeFixes/bin/Release/netstandard2.0/QuerySpec.Analyzers.CodeFixes.dll       /tmp/build1/

    - name: Clean and second build
      run: |
        set -euo pipefail
        for proj in \
          src/QuerySpec.Analyzers \
          src/QuerySpec.Analyzers.CodeFixes \
          src/QuerySpec.Core \
          src/QuerySpec.EFCore \
          src/QuerySpec.DependencyInjection
        do
          rm -rf "$proj/bin" "$proj/obj"
        done
        common="-p:ContinuousIntegrationBuild=true -p:Deterministic=true -p:SignAssembly=false -p:DelaySign=false"
        for proj in \
          src/QuerySpec.Analyzers/QuerySpec.Analyzers.csproj \
          src/QuerySpec.Analyzers.CodeFixes/QuerySpec.Analyzers.CodeFixes.csproj \
          src/QuerySpec.Core/QuerySpec.Core.csproj \
          src/QuerySpec.EFCore/QuerySpec.EFCore.csproj \
          src/QuerySpec.DependencyInjection/QuerySpec.DependencyInjection.csproj
        do
          dotnet build "$proj" --configuration Release $common
        done
        mkdir -p /tmp/build2
        cp src/QuerySpec.Core/bin/Release/net10.0/QuerySpec.Core.dll                                            /tmp/build2/
        cp src/QuerySpec.EFCore/bin/Release/net10.0/QuerySpec.EFCore.dll                                        /tmp/build2/
        cp src/QuerySpec.DependencyInjection/bin/Release/net10.0/QuerySpec.DependencyInjection.dll              /tmp/build2/
        cp src/QuerySpec.Analyzers/bin/Release/netstandard2.0/QuerySpec.Analyzers.dll                           /tmp/build2/
        cp src/QuerySpec.Analyzers.CodeFixes/bin/Release/netstandard2.0/QuerySpec.Analyzers.CodeFixes.dll       /tmp/build2/

    - name: Compare assembly hashes
      id: repro
      run: |
        set -euo pipefail
        failed=0
        for asm in \
          QuerySpec.Core.dll \
          QuerySpec.EFCore.dll \
          QuerySpec.DependencyInjection.dll \
          QuerySpec.Analyzers.dll \
          QuerySpec.Analyzers.CodeFixes.dll
        do
          hash1=$(sha256sum "/tmp/build1/$asm" | awk '{print $1}')
          hash2=$(sha256sum "/tmp/build2/$asm" | awk '{print $1}')
          if [[ "$hash1" != "$hash2" ]]; then
            echo "::error::Non-deterministic build: $asm differs ($hash1 vs $hash2)"
            failed=$((failed + 1))
          else
            echo "OK: $asm sha256=$hash1"
          fi
        done
        echo "identical=$([[ $failed -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi
        echo "All 5 assemblies are byte-identical across both builds."

    - name: Emit reproducibility evidence
      if: always()
      shell: bash
      env:
        STARTED_AT: ${{ env.STARTED_AT }}
      run: |
        set -euo pipefail
        chmod +x eng/emit-evidence.sh
        verdict=pass
        identical=true
        if [[ "${{ steps.repro.outcome }}" != "success" ]]; then verdict=fail; identical=false; fi
        summary=$(jq -n \
          --argjson id "$identical" \
          '{identical:$id, assemblies_checked:5, assemblies:["QuerySpec.Core.dll","QuerySpec.EFCore.dll","QuerySpec.DependencyInjection.dll","QuerySpec.Analyzers.dll","QuerySpec.Analyzers.CodeFixes.dll"]}')
        eng/emit-evidence.sh --gate reproducibility --verdict "$verdict" \
          --summary-json "$summary" --output-dir ./evidence
    - name: Upload reproducibility evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-reproducibility
        path: ./evidence
        retention-days: 30

  aggregate-evidence:
    name: Aggregate evidence index
    needs: [build, format, codeql, vulnerability-scan, commitlint, reproducibility]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
      with:
        egress-policy: audit
        disable-sudo: true
        disable-file-monitoring: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Download all per-gate evidence
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: ./all-evidence
        pattern: 'evidence-*'
        merge-multiple: true

    - name: Aggregate
      id: agg
      shell: bash
      run: |
        set +e
        chmod +x eng/aggregate-evidence.sh
        eng/aggregate-evidence.sh \
          --input-dir ./all-evidence \
          --output ./evidence-index.json \
          --workflow ci
        echo "rc=$?" >> "$GITHUB_OUTPUT"

    - name: Show aggregated index
      if: always()
      run: |
        if [[ -f ./evidence-index.json ]]; then
          jq '{sha, ref, overall_verdict, blocking_failures, gates: (.gates | to_entries | map({key: .key, verdict: .value.verdict, blocking: .value.blocking}))}' ./evidence-index.json
        fi

    - name: Upload evidence-index
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: evidence-index
        path: ./evidence-index.json
        retention-days: 90

    - name: Fail if any blocking gate failed
      if: steps.agg.outputs.rc != '0'
      run: |
        echo "::error::Aggregated CI evidence reports a blocking-gate failure. See the evidence-index artifact."
        exit 1
