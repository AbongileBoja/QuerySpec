title = "QuerySpec gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Strong-name public-key blob — magic 0x00 0x24 0x00 0x00 (PUBLICKEYBLOB), not a secret. The matching private key is held only as a GitHub Actions encrypted secret (STRONG_NAME_KEY_BASE64) bound to the release-signing environment."
paths = ['''(^|/)QuerySpec\.public\.snk$''']

[[allowlists]]
description = "CHANGELOG.md is generated by standard-version and contains commit SHAs that can resemble high-entropy strings. Hand-curated content only enters via PR review."
paths = ['''(^|/)CHANGELOG\.md$''']

[[allowlists]]
description = "Roslyn-style PublicAPI tracking files. Public symbol names can be long, hyphenated, and high-entropy; they are part of the package contract, not secrets."
paths = ['''(^|/)PublicAPI\.(Shipped|Unshipped)\.txt$''']

[[allowlists]]
description = "Local benchmark output. Untracked but listed defensively so an accidental commit of a results JSON does not block the workflow on noise."
paths = ['''(^|/)benchmarks/baseline-run/''']
